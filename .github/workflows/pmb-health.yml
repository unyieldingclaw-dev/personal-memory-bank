name: PMB Health

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  file-size:
    name: File Size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check file sizes
        shell: bash
        run: |
          FAIL=0

          echo "=== memory-bank files (per-file limits) ==="
          declare -A MB_WARN=( [projectbrief.md]=50  [activeContext.md]=100 [systemPatterns.md]=80  [techContext.md]=80  [progress.md]=250 )
          # progress.md's line FAIL was raised 400 -> 600 on 2026-08-24, then RATCHETED BACK to 500
          # on 2026-08-30 once an archive pass made room. The history below explains the raise and
          # is kept because the reasoning still governs -- but read it against the CURRENT value of
          # 500, not the 600 it argued for. WHY the raise happened: at 400 lines the file
          # was 39,590 bytes against a 48,000 WARN and a 60,000 FAIL, so the LINE cap bound first --
          # and the line cap is the metric this very block's comment already identifies as measuring
          # the wrong dimension. It was not a theoretical problem: the file sat at 400/400 and could
          # not accept a new entry, review round 5's findings were written under round 4's heading
          # because there was no room for a new section, and a 34-line archive relocation was fully
          # absorbed by a single subsequent entry. Raising it to 600 puts the byte WARN (~485 lines
          # at this file's ~99 chars/line) first, so the metric that tracks real context cost is the
          # one that fires. The line cap stays as a secondary tripwire against pathological growth.
          declare -A MB_FAIL=( [projectbrief.md]=80  [activeContext.md]=150 [systemPatterns.md]=120 [techContext.md]=120 [progress.md]=500 )
          # WHY byte limits alongside line limits: a line cap measures the wrong dimension --
          # collapsing multi-line entries into one long line satisfies it while saving zero
          # tokens. That is not hypothetical: on 2026-08-19 a cap breach in activeContext.md was
          # "fixed" by reflowing 158 lines to 134 with byte-identical content, CI green, no
          # reduction in the actual SessionStart cost these caps exist to bound. Since every
          # memory-bank file is re-read at session start and again after each compaction, bytes
          # (not lines) are what the context budget actually pays for.
          #
          # WHY the byte thresholds are asymmetric with the line thresholds: WARN is a rounded
          # budget in the neighbourhood of "that file's line cap at ~120 chars/line" -- roughly
          # derived, not a formula (the two largest files anchor on their FAIL line cap, the
          # smaller ones on their WARN line cap, and all are rounded to legible numbers); FAIL is
          # a ceiling set above present size so this check does not immediately block all work
          # on files that are already over. This is deliberately a ratchet -- as files shrink,
          # lower MB_FAIL_BYTES toward MB_WARN_BYTES. A FAIL value that is never tightened is a
          # cap in name only.
          #
          # RATCHETED DOWN 2026-08-30. The three smallest files held 96,777 bytes of unused
          # ceiling at 2-4% of allocation while activeContext.md and progress.md sat at 98-99%.
          # (projectbrief.md is Tier 1 IMMUTABLE, not STABLE; an earlier draft here said
          # 'stable-tier files', contradicting the Authority Tiers table.) --
          # caps manufacturing emergencies in two files and enforcing nothing in three.
          # projectbrief 20000->8000, systemPatterns/techContext 40000->12000, all still 5-10x
          # live size: a guardrail, not the tripwire this comment warns about. progress.md
          # 60000->55000 and lines 600->500 after a 20,452-byte verbatim archive pass the same day.
          # No resulting absolute is quoted: two earlier drafts of this comment each named one and
          # each was stale before the branch merged, because entries kept being appended after the
          # measurement. The delta is the part that does not decay. activeContext.md is UNCHANGED at 45000 -- it has not
          # shrunk, and tightening a cap on a file at 98% is exactly that tripwire.
          declare -A MB_WARN_BYTES=( [projectbrief.md]=4000 [activeContext.md]=18000 [systemPatterns.md]=6000  [techContext.md]=6000  [progress.md]=48000 )
          # activeContext.md sits at ~39 KB as of 2026-08-19, so a 40000 ceiling would have left
          # ~600 bytes of headroom and gone red on the next ordinary edit -- a tripwire, not a
          # guardrail. 45000 catches genuine runaway while the WARN at 18000 carries the real
          # signal. RATCHET THIS DOWN once activeContext.md is actually trimmed; a ceiling that
          # only ever moves up is not a cap.
          declare -A MB_FAIL_BYTES=( [projectbrief.md]=8000  [activeContext.md]=45000 [systemPatterns.md]=12000 [techContext.md]=12000 [progress.md]=55000 )
          while IFS= read -r -d '' file; do
            base=$(basename "$file")
            warn=${MB_WARN[$base]:-80}
            fail=${MB_FAIL[$base]:-150}
            warnb=${MB_WARN_BYTES[$base]:-12000}
            failb=${MB_FAIL_BYTES[$base]:-30000}
            lines=$(wc -l < "$file")
            bytes=$(wc -c < "$file")
            if [ "$lines" -gt "$fail" ]; then
              echo "FAIL: $file ($lines lines -- limit $fail)"
              FAIL=1
            elif [ "$lines" -gt "$warn" ]; then
              echo "WARN: $file ($lines lines -- warn $warn)"
            else
              echo "OK:   $file ($lines lines)"
            fi
            if [ "$bytes" -gt "$failb" ]; then
              echo "FAIL: $file ($bytes bytes -- limit $failb)"
              FAIL=1
            elif [ "$bytes" -gt "$warnb" ]; then
              echo "WARN: $file ($bytes bytes -- warn $warnb; ~$((bytes / 4)) tokens re-read every session start and compaction)"
            else
              echo "OK:   $file ($bytes bytes)"
            fi
          done < <(find memory-bank -name "*.md" -print0 2>/dev/null)

          # === relocation destinations (living documents only) ===
          # WHY this block exists: `standards/MEMORY-BANK.md`'s Eviction Criteria permit moving
          # completed progress.md entries verbatim to a bounded destination. "Bounded" has two
          # branches. Archive files under Archive Structure are bounded by construction -- one
          # topic or period per file, never appended -- so they are deliberately NOT checked here.
          # A *living* destination is the hazard: it is appended to indefinitely, so without a cap
          # a relocation just moves content from a capped file into an unbounded one and reports
          # the cap "resolved". That was live on 2026-08-26: docs/MEMORY-BANK-PARADIGM-REVIEW.md
          # had taken two relocations and stood at 693 lines / 56,732 bytes under no cap at all.
          #
          # WHY the thresholds differ in KIND from the memory-bank ones above: these files are NOT
          # re-read at session start -- that is the entire point of relocating into them -- so the
          # number does not bound startup context cost. It bounds unchecked accretion. Set above
          # present size per this workflow's existing ratchet convention, and RATCHET DOWN as the
          # file is genuinely trimmed; a ceiling that only ever moves up is not a cap.
          declare -A DEST_WARN_BYTES=( [MEMORY-BANK-PARADIGM-REVIEW.md]=64000 )
          declare -A DEST_FAIL_BYTES=( [MEMORY-BANK-PARADIGM-REVIEW.md]=96000 )
          for dest in "${!DEST_WARN_BYTES[@]}"; do
            f="docs/$dest"
            [ -f "$f" ] || continue
            bytes=$(wc -c < "$f")
            warnb=${DEST_WARN_BYTES[$dest]}
            failb=${DEST_FAIL_BYTES[$dest]}
            if [ "$bytes" -gt "$failb" ]; then
              echo "FAIL: $f ($bytes bytes -- limit $failb)"
              FAIL=1
            elif [ "$bytes" -gt "$warnb" ]; then
              echo "WARN: $f ($bytes bytes -- warn $warnb)"
            else
              echo "OK:   $f ($bytes bytes)"
            fi
          done

          # === Aggregate startup-context budget ===
          # WHY this exists in addition to the per-file caps above: `mb doctor` check 15 has long
          # declared an AGGREGATE ceiling (WARN >15 KB, ERROR >25 KB across CLAUDE.md plus the five
          # memory-bank files) -- and CI never checked it, so CI could report all-green on a repo
          # that `mb doctor` was simultaneously calling an ERROR. That contradiction was live: on
          # 2026-08-19 the same repo state produced "[OK] File sizes within limits" from the
          # line-based check and "[ERROR] Startup context 96.7 KB exceeds 25 KB limit" from doctor.
          #
          # The aggregate is the REAL budget -- it is what a session actually pays at start and
          # again after every compaction. The per-file caps above are a coarse backstop that
          # localises WHICH file grew; they are deliberately subordinate to this number and must
          # never be read as permission to reach their sum.
          #
          # WHY advisory here rather than blocking: the repo is presently ~4x over this ceiling, so
          # failing on it would red the build immediately and block the very work needed to get
          # under it. Thresholds are stated at doctor's real values rather than inflated to
          # whatever currently passes -- an honest number that is not yet enforced beats a
          # comfortable one that is. Make this blocking once memory-bank/ is genuinely under 25 KB.
          echo ""
          echo "=== aggregate startup context (mirrors mb doctor check 15) ==="
          CEIL=0
          [ -f CLAUDE.md ] && CEIL=$((CEIL + $(wc -c < CLAUDE.md)))
          # Enumerated, not listed: CLAUDE.md defines startup context as CLAUDE.md plus EVERY file
          # in memory-bank/, and memory-bank/README.md (1,116 B) was in no list. A seventh file
          # added later would have fallen through to the per-file default cap, letting ~30 KB of
          # startup growth land while the ratchet below printed "under". Both sides enumerate, so
          # they always measure the same set.
          # RECURSIVE, matching the ls-tree -r baseline below. A `memory-bank/*.md` glob is NOT
          # recursive, so the two sides enumerated different sets: a 30,000-byte file at
          # memory-bank/sub/notes.md was demonstrated invisible to the ratchet while the recursive
          # per-file pass above still measured it. Both sides recurse now, so "same set" is true.
          while IFS= read -r f; do
            CEIL=$((CEIL + $(wc -c < "$f")))
          done < <(find memory-bank -name "*.md" -type f 2>/dev/null)
          CEIL_KB=$(awk "BEGIN {printf \"%.1f\", $CEIL / 1024}")
          # RATCHET, added 2026-08-30, REDESIGNED the same day after review.
          #
          # The 25 KB ceiling stays advisory because the repo is still ~4x over it and failing on
          # that would block the work needed to get under it. But "advisory" was being read as "may
          # grow", and it did. So the CEILING is advisory while the DIRECTION is enforced.
          #
          # WHY A MERGE-BASE COMPARISON AND NOT A CHECKED-IN CONSTANT: the first version of this
          # block hardcoded STARTUP_BASELINE=108973, and review killed it on two counts, both right.
          # (1) It was a TRIPWIRE, the exact thing the comment fifty lines above defines and refuses
          # to set: 1,024 bytes of slack against six files, when the median recent progress.md entry
          # is ~2,700 bytes and scripts/pre-compact-check.sh REQUIRES an entry dated today before it
          # will allow a compaction. Growth is not optional here, so a sub-1% allowance would have
          # red-lined a required, enforce_admins check on the next ordinary PR. (2) "Only ever
          # decrease" was asserted in a comment and enforced by nothing -- the constant lived in a
          # file any PR could edit, so the monotonicity being sold was unenforceable by construction,
          # and the documented remedy ("justify raising it") is the raise-the-cap-while-blocked-by-
          # the-cap shape this repo already recorded as an anti-pattern.
          #
          # Comparing against origin/main fixes both: the baseline cannot be rewritten by the PR
          # being judged, and it falls automatically as main shrinks, which is what a ratchet is.
          # Reductions are always free. This branch lands NET NEGATIVE against main, so it blocks
          # runaway growth rather than ordinary work -- but read that as a ONE-TIME CREDIT, not
          # recurring headroom. It exists because this branch archived a large block of prose; the
          # next branch inherits the lower baseline and starts at zero margin. NO ABSOLUTE IS QUOTED
          # HERE, deliberately: three earlier drafts said ~16 KB, ~15 KB and 13,107 B, and all three
          # were stale before the branch merged -- the third was exactly right at the commit that
          # wrote it and wrong two commits later. This check computes the margin live and prints it;
          # read it from that output, never from this comment. (An earlier draft of this very
          # sentence said "twenty lines below" and was itself wrong by twenty-two lines -- a distance
          # is a level too, and decays on any edit between the two points.) That is the same
          # decaying-absolute problem the archive header two directories over refuses to repeat.
          #
          # The fetch is explicit because actions/checkout defaults to a shallow, single-commit
          # clone; without it `git show origin/main:` finds nothing. If the fetch fails (fork, no
          # network, main absent) the check DEGRADES TO ADVISORY rather than failing the build --
          # an unavailable baseline is not evidence of growth.
          git fetch --depth=1 origin main >/dev/null 2>&1 || true
          BASE_CEIL=$(git cat-file -s "origin/main:CLAUDE.md" 2>/dev/null || echo 0)
          BASE_OK=1
          [ "$BASE_CEIL" -gt 0 ] || BASE_OK=0
          BASE_FILES=0
          # NUL-delimited. The unquoted `for f in $(git ls-tree ...)` form word-splits any filename
          # containing a space into nonexistent paths; both lookups fail, BASE_OK goes 0, and this
          # REQUIRED, enforce_admins check silently degrades to "SKIP: baseline unavailable" while
          # still reporting PASS. Once such a filename is on main it disables the ratchet repo-wide
          # for every later PR. Demonstrated against a real tree with "memory-bank/space file.md".
          # Success is the cat-file EXIT STATUS, not `-gt 0`, so a legitimately empty file counts as
          # resolved -- the PowerShell twin already treated it that way and the two disagreed.
          while IFS= read -r -d '' f; do
            case "$f" in *.md) ;; *) continue ;; esac
            if b=$(git cat-file -s "origin/main:$f" 2>/dev/null); then
              BASE_CEIL=$((BASE_CEIL + b))
            else
              BASE_OK=0
            fi
            BASE_FILES=$((BASE_FILES + 1))
          done < <(git ls-tree -rz --name-only origin/main -- memory-bank/ 2>/dev/null)
          # F3: BASE_OK is only cleared INSIDE the loop, so a baseline with CLAUDE.md but zero
          # memory-bank files (the ordinary first-adoption shape) left it TRUE and produced a
          # ~94 KB false regression. A partially-unreachable baseline is unreachable.
          [ "$BASE_FILES" -gt 0 ] || BASE_OK=0
          if [ "$BASE_OK" = "1" ] && [ "$BASE_CEIL" -gt 0 ]; then
            BASE_KB=$(awk "BEGIN {printf \"%.1f\", $BASE_CEIL / 1024}")
            if [ "$CEIL" -gt "$BASE_CEIL" ]; then
              echo "FAIL: startup context grew ${CEIL_KB} KB vs ${BASE_KB} KB on origin/main (+$((CEIL - BASE_CEIL)) bytes)"
              echo "      The aggregate budget is a ratchet: it may shrink, never grow. Archive to"
              echo "      docs/archive/ per standards/MEMORY-BANK.md's eviction rules, or move detail"
              echo "      out of CLAUDE.md or memory-bank/. Reductions always pass."
              FAIL=1
            else
              echo "OK:    startup context ${CEIL_KB} KB vs ${BASE_KB} KB on origin/main ($((BASE_CEIL - CEIL)) bytes under)"
            fi
          else
            echo "SKIP:  origin/main baseline unavailable -- ratchet advisory this run"
          fi
          if [ "$CEIL" -gt 25600 ]; then
            echo "OVER:  startup context ${CEIL_KB} KB exceeds the 25 KB ceiling (~$((CEIL / 4)) tokens per session start, re-paid after every compaction)"
            echo "       ceiling advisory; the origin/main no-regression ratchet above is ENFORCED"
          elif [ "$CEIL" -gt 15360 ]; then
            echo "WARN:  startup context ${CEIL_KB} KB exceeds the 15 KB warn line (~$((CEIL / 4)) tokens per session start)"
          else
            echo "OK:    startup context ${CEIL_KB} KB (warn 15 KB, ceiling 25 KB)"
          fi

          echo ""
          echo "=== all other markdown files (warn: 500, fail: 800) ==="
          while IFS= read -r -d '' file; do
            lines=$(wc -l < "$file")
            if [ "$lines" -gt 800 ]; then
              echo "FAIL: $file ($lines lines -- limit 800)"
              FAIL=1
            elif [ "$lines" -gt 500 ]; then
              echo "WARN: $file ($lines lines -- warn 500)"
            fi
          done < <(find . -name "*.md" \
            -not -path "./memory-bank/*" \
            -not -path "./.git/*" \
            -not -path "./.claude/worktrees/*" \
            -not -path "./docs/superpowers/plans/*" \
            -print0)

          echo ""
          [ "$FAIL" -eq 0 ] && echo "file-size: PASS" || echo "file-size: FAIL"
          exit $FAIL

  forbidden-patterns:
    name: Forbidden Patterns
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Credential grep
        id: credential-grep
        continue-on-error: true
        shell: bash
        run: |
          if git grep -P -i '(password|api_key|token|secret)\s*=\s*[A-Za-z0-9]{8,}' \
            -- ':(exclude).gitleaks.toml' ':(exclude).gitignore'; then
            echo "FAIL: Literal credential assignment found above"
            exit 1
          fi
          echo "OK: No literal credential assignments found"

      - name: Spec placeholder grep
        id: spec-placeholder-grep
        continue-on-error: true
        shell: bash
        run: |
          # Exclude *ci-governance* specs: they document the CI pattern itself
          # and necessarily reference the placeholder markers in prose.
          #
          # WHY strip code blocks/inline code first: specs about this very
          # placeholder-detection feature (or about the grep pattern itself)
          # necessarily show TODO/TBD as a code example (fenced ```...``` block
          # or inline `backticks`), not as real leftover placeholder residue.
          # Stripping code-formatted text before matching distinguishes "an
          # example of the pattern" from "an actual unresolved placeholder".
          # WHY the fence-count guard: an unbalanced (odd) count of ``` markers
          # means the file has a malformed/unterminated fence -- naively
          # toggling on every ``` would silently treat the rest of the file as
          # "inside code" and never check it again. Falling back to inline-only
          # stripping in that case keeps the rest of the file checked, erring
          # toward catching a real placeholder rather than silently missing one.
          #
          # WHY the per-line backtick-parity guard: a line with an ODD number of
          # backticks has a stray, unpaired backtick. A naive `s/`[^`]*`//g` still
          # pairs it with the NEXT backtick on the line -- even an unrelated,
          # legitimately-paired one from later in the line -- silently deleting
          # everything between them, including any placeholder marker that stray
          # backtick was placed in front of. Requiring an EVEN count before
          # stripping a line at all closes that: an unpaired backtick means
          # nothing on that line is provably real inline code, so nothing is
          # stripped and the line is checked as-is.
          strip_code() {
            local file="$1"
            local fence_count
            fence_count=$(grep -c '^```' "$file" 2>/dev/null)
            fence_count=${fence_count:-0}
            local fence_stage
            if [ $((fence_count % 2)) -ne 0 ]; then
              fence_stage=$(cat "$file")
            else
              fence_stage=$(awk '/^```/{f=!f;next} f{next} {print}' "$file")
            fi
            printf '%s\n' "$fence_stage" | awk '
              {
                line = $0
                n = gsub(/`/, "`", line)
                if (n % 2 == 0) {
                  gsub(/`[^`]*`/, "", line)
                }
                print line
              }
            '
          }
          FAIL=0
          FOUND=""
          while IFS= read -r -d '' file; do
            if strip_code "$file" | grep -qE '\bTBD\b|\bTODO\b'; then
              FOUND="$FOUND$file"$'\n'
              FAIL=1
            fi
          done < <(find docs/superpowers/specs -name "*.md" -not -name "*ci-governance*" -print0)
          if [ "$FAIL" -eq 1 ]; then
            echo "FAIL: placeholder markers found in spec files:"
            printf '%s' "$FOUND"
            exit 1
          fi
          echo "OK: No placeholder markers in spec files"

      - name: Shellcheck
        id: shellcheck
        continue-on-error: true
        shell: bash
        run: |
          # Build directory list from those that actually exist
          SHELL_DIRS=()
          [ -d scripts ] && SHELL_DIRS+=(scripts)
          [ -d templates/scripts ] && SHELL_DIRS+=(templates/scripts)
          if [ "${#SHELL_DIRS[@]}" -gt 0 ]; then
            find "${SHELL_DIRS[@]}" -name "*.sh" -print0 \
              | xargs -r -0 shellcheck --severity=error
          fi
          echo "OK: Shellcheck passed"

      # WHY continue-on-error + this gate, instead of letting each step fail
      # the job immediately: with 3 sequential steps and no continue-on-error,
      # the first failure stops the rest from ever running -- a fixed credential-
      # grep false positive could mask a real shellcheck failure for months
      # without anyone seeing it (this exact class of bug hit Bowling-Tracker
      # and gmail-organizer's CI in 2026-07). Running all 3 unconditionally and
      # gating at the end surfaces every problem in one run instead of one at a time.
      - name: Gate on all forbidden-patterns checks
        if: always()
        shell: bash
        run: |
          FAIL=0
          [ "${{ steps.credential-grep.outcome }}" != "success" ] && { echo "FAILED: Credential grep"; FAIL=1; }
          [ "${{ steps.spec-placeholder-grep.outcome }}" != "success" ] && { echo "FAILED: Spec placeholder grep"; FAIL=1; }
          [ "${{ steps.shellcheck.outcome }}" != "success" ] && { echo "FAILED: Shellcheck"; FAIL=1; }
          exit $FAIL

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      # gitleaks-action v2.3.9 still uses node20; no Node 24 release exists yet.
      # FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 silences the deprecation warning until upstream ships a fix.
      # Pinned to SHA for supply-chain safety. Dependabot will auto-PR updates.
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Run Semgrep
        shell: bash
        run: |
          pip install semgrep --quiet
          # Scan shell scripts in scripts/ and templates/scripts/ with the bash
          # ruleset. PowerShell (.ps1) files are scanned opportunistically — Semgrep
          # has limited PS support but will still catch generic patterns.
          # --error exits non-zero on any finding at the default severity threshold.
          SCAN_DIRS=""
          [ -d scripts ]            && SCAN_DIRS="$SCAN_DIRS scripts"
          [ -d templates/scripts ]  && SCAN_DIRS="$SCAN_DIRS templates/scripts"
          if [ -z "$SCAN_DIRS" ]; then
            echo "No script directories found — skipping SAST"
            exit 0
          fi
          # WHY auto: "p/bash" is no longer a resolvable Semgrep Registry
          # ruleset (returns HTTP 404) — auto is Semgrep's own maintained
          # zero-config default, detecting languages present and applying
          # the appropriate rulesets.
          semgrep --config auto --error $SCAN_DIRS

  rules-file-integrity:
    name: Rules-File Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Invisible Unicode characters
        id: invisible-unicode
        continue-on-error: true
        shell: bash
        run: |
          # Scan CLAUDE.md and standards/ for invisible Unicode that could smuggle
          # hidden instructions: the whole Cf (Format) category — zero-width
          # space/joiner, BOM, bidi overrides and isolates, soft hyphen, word
          # joiner, and the Tag block — plus the Hangul fillers, which are Lo
          # rather than Cf but still render as blank.
          FAIL=0
          FILES=$(find standards CLAUDE.md templates/CLAUDE.md -name "*.md" -o -name "CLAUDE.md" 2>/dev/null | sort -u)
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            # THREE THINGS HERE ARE LOAD-BEARING; each stops a specific wrong fix.
            #
            # 1. (*UTF), NOT LC_ALL=C. Until 2026-09-08 this used LC_ALL=C with an
            #    enumerated \x{...} class. LC_ALL=C puts PCRE in 8-bit non-UTF mode
            #    where \x{200B} exceeds the single-byte maximum, so grep aborted on
            #    its own pattern ("character value in \x{} or \o{} is too large",
            #    status 2), a 2>/dev/null hid the message, status 2 made the `if`
            #    false, and the step printed OK over a tree containing a real
            #    U+200B. It had never been able to fail since the day it was
            #    written, and was found by planting a violation rather than by
            #    reading it. MEASURED, so nobody repeats it: merely DROPPING
            #    LC_ALL=C does NOT fix this — the ambient locale can be non-UTF-8
            #    too, and was on the machine where this was found. (*UTF) forces
            #    UTF mode regardless of locale.
            #
            # 2. A CATEGORY, NOT A LIST. The enumeration missed the Unicode Tag
            #    block (U+E0000-E007F), which hides an entire ASCII payload one
            #    invisible character per letter and renders blank in terminals and
            #    in GitHub's diff viewer — the strongest vector of the set, absent
            #    from a list written to stop exactly this. It also missed U+2060,
            #    interchangeable with the U+200B it did block. \p{Cf} is the
            #    category the technique relies on, so it covers those and whatever
            #    Unicode adds later, with no list to keep current. The four
            #    explicit points are Hangul fillers: category Lo, not Cf, but they
            #    render as blank. Do not "simplify" this back to an enumeration.
            #
            # 3. THE STATUS IS READ, NOT SWALLOWED — that is what made the original
            #    failure silent. 0 = a real hit, 1 = clean, anything else means grep
            #    itself failed, which is a BROKEN CHECK and must be loud rather than
            #    quietly green. `|| rc=$?` keeps this exempt from `set -e`, which
            #    `shell: bash` sets via -eo pipefail.
            rc=0
            grep -Pn '(*UTF)[\p{Cf}\x{115F}\x{1160}\x{3164}\x{FFA0}]' "$file" || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "FAIL: $file — invisible Unicode character(s) found above"
              FAIL=1
            elif [ "$rc" -ne 1 ]; then
              echo "FAIL: $file — grep exited $rc, so this file was NOT scanned. This is a broken check, not a pass."
              FAIL=1
            fi
          done <<< "$FILES"
          [ "$FAIL" -eq 0 ] && echo "OK: No invisible Unicode characters found"
          exit $FAIL

      - name: Hidden HTML comments in Markdown
        id: hidden-html-comments
        continue-on-error: true
        shell: bash
        run: |
          # HTML comments (<!-- -->) render invisibly in Markdown but are visible
          # to LLMs, making them a smuggling vector for hidden instructions.
          # WHY strip fenced code + paired inline-code spans first: a `<!-- -->`
          # wrapped in a genuinely CLOSED backtick span renders visibly as
          # monospace text — a documented example of the forbidden pattern, not
          # an actual hidden comment. A single-char lookbehind check is bypassable
          # with one unmatched backtick (it never renders as code, so the real
          # comment stays invisible); requiring a matched `[^`]*` pair closes that.
          # WHY the fence-count guard: an unbalanced (odd) count of ``` markers
          # means the file has a malformed/unterminated fence -- naively
          # toggling on every ``` would silently treat the rest of the file as
          # "inside code" and never check it again. Falling back to inline-only
          # stripping in that case keeps the rest of the file checked, erring
          # toward catching a real hidden comment rather than silently missing one.
          #
          # WHY the per-line backtick-parity guard: a line with an ODD number of
          # backticks has a stray, unpaired backtick. A naive `s/`[^`]*`//g` still
          # pairs it with the NEXT backtick on the line -- even an unrelated,
          # legitimately-paired one from later in the line -- silently deleting
          # everything between them, including a real hidden comment that stray
          # backtick was placed in front of. Requiring an EVEN count before
          # stripping a line at all closes that: an unpaired backtick means
          # nothing on that line is provably real inline code, so nothing is
          # stripped and the line is checked as-is.
          strip_code() {
            local file="$1"
            local fence_count
            fence_count=$(grep -c '^```' "$file" 2>/dev/null)
            fence_count=${fence_count:-0}
            local fence_stage
            if [ $((fence_count % 2)) -ne 0 ]; then
              fence_stage=$(cat "$file")
            else
              fence_stage=$(awk '/^```/{f=!f;next} f{next} {print}' "$file")
            fi
            printf '%s\n' "$fence_stage" | awk '
              {
                line = $0
                n = gsub(/`/, "`", line)
                if (n % 2 == 0) {
                  gsub(/`[^`]*`/, "", line)
                }
                print line
              }
            '
          }
          FAIL=0
          FILES=$(find standards CLAUDE.md templates/CLAUDE.md -name "*.md" -o -name "CLAUDE.md" 2>/dev/null | sort -u)
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            if strip_code "$file" | grep -Pn '<!--'; then
              echo "FAIL: $file — HTML comment found above (hidden from rendered view, visible to LLMs)"
              FAIL=1
            fi
          done <<< "$FILES"
          [ "$FAIL" -eq 0 ] && echo "OK: No hidden HTML comments found"
          exit $FAIL

      - name: LLM bypass phrases
        id: llm-bypass-phrases
        continue-on-error: true
        shell: bash
        run: |
          # Scan CLAUDE.md and templates/CLAUDE.md for known prompt-injection bypass
          # phrases. Security docs (RULES-FILE-INTEGRITY.md, AGENTIC-SAFETY.md,
          # SECURITY-GUARDRAILS.md) are excluded — they legitimately document these
          # patterns as examples.
          FAIL=0
          BYPASS_PATTERNS=(
            'ignore (all )?(previous|above) instructions'
            'ignore (all )?instructions'
            'disregard (your )?(previous )?instructions'
            'forget (your )?(previous )?instructions'
            'new (system )?instructions?:'
            'you are now a'
            'from now on (you are|act as)'
            'system prompt override'
            'jailbreak'
          )
          for file in CLAUDE.md templates/CLAUDE.md; do
            [ -f "$file" ] || continue
            for pattern in "${BYPASS_PATTERNS[@]}"; do
              if grep -Pin "$pattern" "$file"; then
                echo "FAIL: $file — bypass phrase matched: $pattern"
                FAIL=1
              fi
            done
          done
          [ "$FAIL" -eq 0 ] && echo "OK: No bypass phrases found in CLAUDE.md files"
          exit $FAIL

      # WHY: same rationale as the forbidden-patterns job's gate step above --
      # 3 sequential checks with no continue-on-error means the first failure
      # hides the other two for as long as nobody happens to fix it.
      - name: Gate on all rules-file-integrity checks
        if: always()
        shell: bash
        run: |
          FAIL=0
          [ "${{ steps.invisible-unicode.outcome }}" != "success" ] && { echo "FAILED: Invisible Unicode characters"; FAIL=1; }
          [ "${{ steps.hidden-html-comments.outcome }}" != "success" ] && { echo "FAILED: Hidden HTML comments in Markdown"; FAIL=1; }
          [ "${{ steps.llm-bypass-phrases.outcome }}" != "success" ] && { echo "FAILED: LLM bypass phrases"; FAIL=1; }
          exit $FAIL

  template-integrity:
    name: Template Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Validate hook scripts referenced in templates/.claude/settings.json exist in templates/scripts/
        shell: bash
        run: |
          FAIL=0
          SETTINGS="templates/.claude/settings.json"
          BASEPATHS=$(grep '"command":' "$SETTINGS" \
            | grep -oE '[A-Za-z][A-Za-z0-9_/-]*\.(sh|ps1)' \
            | sed 's/\.[^.]*$//' \
            | sort -u)
          for base in $BASEPATHS; do
            if [ -n "$(compgen -G "templates/${base}.*" 2>/dev/null)" ]; then
              echo "OK:   templates/${base}.* present"
            else
              echo "ERROR: $SETTINGS references $base but the script is missing from templates/:"
              printf  "       Expected: templates/%s.sh\n" "$base"
              printf  "       Expected: templates/%s.ps1\n" "$base"
              FAIL=1
            fi
          done
          bash scripts/check-review-gate-lib-presence.sh templates/scripts || FAIL=1
          [ "$FAIL" -eq 0 ] && echo "template-integrity: PASS" || echo "template-integrity: FAIL"
          exit $FAIL

  mb-command-tests:
    name: MB Command Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # WHY this job needs the fetch too: actions/checkout leaves a shallow clone with no
      # refs/remotes/origin/main, and test-threshold-parity.sh's baseline probe resolves the same
      # origin/main blobs the file-size job's ratchet does. Without it the probe measures an absent
      # ref and fails here while the identical primitive succeeds one job over -- a result that
      # varies by which job takes the measurement, which this repo does not accept as a gate.
      # The STEP is tolerant; the JOB is not, and the difference matters. `|| true` only stops a
      # fetch failure from being reported as a step error -- the probe downstream produces the
      # precise verdict, and unlike the file-size job's SKIP path it FAILS HARD on an unresolved
      # baseline. stderr is deliberately NOT discarded: the remedy the probe prints is "fetch it",
      # so a reader who cannot see git's reason for the fetch failing is sent back to the step that
      # already tried. stdout is quiet because success has nothing to say.
      - name: Fetch main for the origin/main baseline probe
        shell: bash
        run: git fetch --depth=1 origin main >/dev/null || true

      - name: Run mb command tests
        shell: bash
        run: bash tests/run.sh

  powershell-lint:
    name: PowerShell Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Lint PowerShell scripts
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Filter "*.ps1" -Path "scripts","templates/scripts" |
            Select-Object -ExpandProperty FullName
          $results = $files | ForEach-Object {
            Invoke-ScriptAnalyzer -Path $_ -Severity Error,Warning -Settings "scripts/PSScriptAnalyzerSettings.psd1"
          }
          if ($results) {
            $results | Format-Table RuleName,Severity,Line,Message -AutoSize
            exit 1
          }
          Write-Host "PSScriptAnalyzer: no errors found in $($files.Count) file(s)"

  mb-doctor-self-check:
    name: MB Doctor Self-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # Same shallow-clone reason as the mb-command-tests job. mb doctor's startup-context ratchet
      # reads the same origin/main blobs, so on a shallow checkout it has never once executed here
      # -- and both mb.sh and mb.ps1 take the no-baseline path with no else branch, printing
      # NOTHING rather than a SKIP.
      #
      # Across the three enforcers test-threshold-parity.sh keeps in parity (grep RATCHET_SOURCES:
      # this workflow, mb.sh, mb.ps1) one condition produces TWO behaviours -- visible SKIP in
      # file-size, silence in both doctors. The suite's hard FAIL is a third behaviour but belongs
      # to the parity CHECKER, which that variable deliberately excludes from the enforcer set.
      #
      # This closes ONE of the two silences. mb.ps1's ratchet stays unexercised in CI: it is
      # reached only through Invoke-Pester, whose only doctor path runs inside a fixture built by
      # tests/setup.sh with no remote, so origin/main resolves nowhere for the PowerShell twin.
      # NOTE 2026-09-06: this makes the ratchet line appear in this job's output for the first
      # time. Read it against the file-size job's figures rather than assuming the two agree.
      # stderr is kept for the same reason as the mb-command-tests fetch above.
      - name: Fetch main for mb doctor's startup-context ratchet
        shell: bash
        run: git fetch --depth=1 origin main >/dev/null || true

      - name: Run mb doctor on this repo
        shell: bash
        run: MB_HOME="$(pwd)" bash scripts/mb.sh doctor

  pester-tests:
    name: Pester Tests (mb.ps1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Pester
        shell: pwsh
        run: Install-Module -Name Pester -Force -Scope CurrentUser -RequiredVersion 5.7.1

      - name: Run Pester tests
        shell: pwsh
        run: |
          $result = Invoke-Pester -Path "tests/" -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) {
            Write-Host "FAILED: $($result.FailedCount) test(s) failed"
            exit 1
          }
          Write-Host "Pester: $($result.PassedCount) passed, 0 failed"
