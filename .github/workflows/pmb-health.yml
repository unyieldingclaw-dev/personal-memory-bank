name: PMB Health

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  file-size:
    name: File Size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Check file sizes
        shell: bash
        run: |
          FAIL=0

          echo "=== memory-bank files (per-file limits) ==="
          declare -A MB_WARN=( [projectbrief.md]=80  [activeContext.md]=100 [systemPatterns.md]=200 [techContext.md]=200 [progress.md]=250 )
          declare -A MB_FAIL=( [projectbrief.md]=120 [activeContext.md]=150 [systemPatterns.md]=300 [techContext.md]=300 [progress.md]=400 )
          # WHY byte limits alongside line limits: a line cap measures the wrong dimension --
          # collapsing multi-line entries into one long line satisfies it while saving zero
          # tokens. That is not hypothetical: on 2026-08-19 a cap breach in activeContext.md was
          # "fixed" by reflowing 158 lines to 134 with byte-identical content, CI green, no
          # reduction in the actual SessionStart cost these caps exist to bound. Since every
          # memory-bank file is re-read at session start and again after each compaction, bytes
          # (not lines) are what the context budget actually pays for.
          #
          # WHY the byte thresholds are asymmetric with the line thresholds: WARN is a rounded
          # budget in the neighbourhood of "that file's line cap at ~120 chars/line" -- roughly
          # derived, not a formula (the two largest files anchor on their FAIL line cap, the
          # smaller ones on their WARN line cap, and all are rounded to legible numbers); FAIL is
          # a ceiling set above present size so this check does not immediately block all work
          # on files that are already over. This is deliberately a ratchet -- as files shrink,
          # lower MB_FAIL_BYTES toward MB_WARN_BYTES. A FAIL value that is never tightened is a
          # cap in name only.
          declare -A MB_WARN_BYTES=( [projectbrief.md]=9600 [activeContext.md]=18000 [systemPatterns.md]=24000 [techContext.md]=24000 [progress.md]=48000 )
          # activeContext.md sits at ~39 KB as of 2026-08-19, so a 40000 ceiling would have left
          # ~600 bytes of headroom and gone red on the next ordinary edit -- a tripwire, not a
          # guardrail. 45000 catches genuine runaway while the WARN at 18000 carries the real
          # signal. RATCHET THIS DOWN once activeContext.md is actually trimmed; a ceiling that
          # only ever moves up is not a cap.
          declare -A MB_FAIL_BYTES=( [projectbrief.md]=20000 [activeContext.md]=45000 [systemPatterns.md]=40000 [techContext.md]=40000 [progress.md]=60000 )
          while IFS= read -r -d '' file; do
            base=$(basename "$file")
            warn=${MB_WARN[$base]:-80}
            fail=${MB_FAIL[$base]:-150}
            warnb=${MB_WARN_BYTES[$base]:-12000}
            failb=${MB_FAIL_BYTES[$base]:-30000}
            lines=$(wc -l < "$file")
            bytes=$(wc -c < "$file")
            if [ "$lines" -gt "$fail" ]; then
              echo "FAIL: $file ($lines lines -- limit $fail)"
              FAIL=1
            elif [ "$lines" -gt "$warn" ]; then
              echo "WARN: $file ($lines lines -- warn $warn)"
            else
              echo "OK:   $file ($lines lines)"
            fi
            if [ "$bytes" -gt "$failb" ]; then
              echo "FAIL: $file ($bytes bytes -- limit $failb)"
              FAIL=1
            elif [ "$bytes" -gt "$warnb" ]; then
              echo "WARN: $file ($bytes bytes -- warn $warnb; ~$((bytes / 4)) tokens re-read every session start and compaction)"
            else
              echo "OK:   $file ($bytes bytes)"
            fi
          done < <(find memory-bank -name "*.md" -print0 2>/dev/null)

          echo ""
          echo "=== all other markdown files (warn: 500, fail: 800) ==="
          while IFS= read -r -d '' file; do
            lines=$(wc -l < "$file")
            if [ "$lines" -gt 800 ]; then
              echo "FAIL: $file ($lines lines -- limit 800)"
              FAIL=1
            elif [ "$lines" -gt 500 ]; then
              echo "WARN: $file ($lines lines -- warn 500)"
            fi
          done < <(find . -name "*.md" \
            -not -path "./memory-bank/*" \
            -not -path "./.git/*" \
            -not -path "./.claude/worktrees/*" \
            -not -path "./docs/superpowers/plans/*" \
            -print0)

          echo ""
          [ "$FAIL" -eq 0 ] && echo "file-size: PASS" || echo "file-size: FAIL"
          exit $FAIL

  forbidden-patterns:
    name: Forbidden Patterns
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Credential grep
        id: credential-grep
        continue-on-error: true
        shell: bash
        run: |
          if git grep -P -i '(password|api_key|token|secret)\s*=\s*[A-Za-z0-9]{8,}' \
            -- ':(exclude).gitleaks.toml' ':(exclude).gitignore'; then
            echo "FAIL: Literal credential assignment found above"
            exit 1
          fi
          echo "OK: No literal credential assignments found"

      - name: Spec placeholder grep
        id: spec-placeholder-grep
        continue-on-error: true
        shell: bash
        run: |
          # Exclude *ci-governance* specs: they document the CI pattern itself
          # and necessarily reference the placeholder markers in prose.
          #
          # WHY strip code blocks/inline code first: specs about this very
          # placeholder-detection feature (or about the grep pattern itself)
          # necessarily show TODO/TBD as a code example (fenced ```...``` block
          # or inline `backticks`), not as real leftover placeholder residue.
          # Stripping code-formatted text before matching distinguishes "an
          # example of the pattern" from "an actual unresolved placeholder".
          # WHY the fence-count guard: an unbalanced (odd) count of ``` markers
          # means the file has a malformed/unterminated fence -- naively
          # toggling on every ``` would silently treat the rest of the file as
          # "inside code" and never check it again. Falling back to inline-only
          # stripping in that case keeps the rest of the file checked, erring
          # toward catching a real placeholder rather than silently missing one.
          #
          # WHY the per-line backtick-parity guard: a line with an ODD number of
          # backticks has a stray, unpaired backtick. A naive `s/`[^`]*`//g` still
          # pairs it with the NEXT backtick on the line -- even an unrelated,
          # legitimately-paired one from later in the line -- silently deleting
          # everything between them, including any placeholder marker that stray
          # backtick was placed in front of. Requiring an EVEN count before
          # stripping a line at all closes that: an unpaired backtick means
          # nothing on that line is provably real inline code, so nothing is
          # stripped and the line is checked as-is.
          strip_code() {
            local file="$1"
            local fence_count
            fence_count=$(grep -c '^```' "$file" 2>/dev/null)
            fence_count=${fence_count:-0}
            local fence_stage
            if [ $((fence_count % 2)) -ne 0 ]; then
              fence_stage=$(cat "$file")
            else
              fence_stage=$(awk '/^```/{f=!f;next} f{next} {print}' "$file")
            fi
            printf '%s\n' "$fence_stage" | awk '
              {
                line = $0
                n = gsub(/`/, "`", line)
                if (n % 2 == 0) {
                  gsub(/`[^`]*`/, "", line)
                }
                print line
              }
            '
          }
          FAIL=0
          FOUND=""
          while IFS= read -r -d '' file; do
            if strip_code "$file" | grep -qE '\bTBD\b|\bTODO\b'; then
              FOUND="$FOUND$file"$'\n'
              FAIL=1
            fi
          done < <(find docs/superpowers/specs -name "*.md" -not -name "*ci-governance*" -print0)
          if [ "$FAIL" -eq 1 ]; then
            echo "FAIL: placeholder markers found in spec files:"
            printf '%s' "$FOUND"
            exit 1
          fi
          echo "OK: No placeholder markers in spec files"

      - name: Shellcheck
        id: shellcheck
        continue-on-error: true
        shell: bash
        run: |
          # Build directory list from those that actually exist
          SHELL_DIRS=()
          [ -d scripts ] && SHELL_DIRS+=(scripts)
          [ -d templates/scripts ] && SHELL_DIRS+=(templates/scripts)
          if [ "${#SHELL_DIRS[@]}" -gt 0 ]; then
            find "${SHELL_DIRS[@]}" -name "*.sh" -print0 \
              | xargs -r -0 shellcheck --severity=error
          fi
          echo "OK: Shellcheck passed"

      # WHY continue-on-error + this gate, instead of letting each step fail
      # the job immediately: with 3 sequential steps and no continue-on-error,
      # the first failure stops the rest from ever running -- a fixed credential-
      # grep false positive could mask a real shellcheck failure for months
      # without anyone seeing it (this exact class of bug hit Bowling-Tracker
      # and gmail-organizer's CI in 2026-07). Running all 3 unconditionally and
      # gating at the end surfaces every problem in one run instead of one at a time.
      - name: Gate on all forbidden-patterns checks
        if: always()
        shell: bash
        run: |
          FAIL=0
          [ "${{ steps.credential-grep.outcome }}" != "success" ] && { echo "FAILED: Credential grep"; FAIL=1; }
          [ "${{ steps.spec-placeholder-grep.outcome }}" != "success" ] && { echo "FAILED: Spec placeholder grep"; FAIL=1; }
          [ "${{ steps.shellcheck.outcome }}" != "success" ] && { echo "FAILED: Shellcheck"; FAIL=1; }
          exit $FAIL

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      # gitleaks-action v2.3.9 still uses node20; no Node 24 release exists yet.
      # FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 silences the deprecation warning until upstream ships a fix.
      # Pinned to SHA for supply-chain safety. Dependabot will auto-PR updates.
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Run Semgrep
        shell: bash
        run: |
          pip install semgrep --quiet
          # Scan shell scripts in scripts/ and templates/scripts/ with the bash
          # ruleset. PowerShell (.ps1) files are scanned opportunistically — Semgrep
          # has limited PS support but will still catch generic patterns.
          # --error exits non-zero on any finding at the default severity threshold.
          SCAN_DIRS=""
          [ -d scripts ]            && SCAN_DIRS="$SCAN_DIRS scripts"
          [ -d templates/scripts ]  && SCAN_DIRS="$SCAN_DIRS templates/scripts"
          if [ -z "$SCAN_DIRS" ]; then
            echo "No script directories found — skipping SAST"
            exit 0
          fi
          # WHY auto: "p/bash" is no longer a resolvable Semgrep Registry
          # ruleset (returns HTTP 404) — auto is Semgrep's own maintained
          # zero-config default, detecting languages present and applying
          # the appropriate rulesets.
          semgrep --config auto --error $SCAN_DIRS

  rules-file-integrity:
    name: Rules-File Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Invisible Unicode characters
        id: invisible-unicode
        continue-on-error: true
        shell: bash
        run: |
          # Scan CLAUDE.md and standards/ for invisible Unicode chars that could
          # smuggle hidden instructions: zero-width space (U+200B), zero-width
          # non-joiner/joiner (U+200C/D), BOM (U+FEFF), RTL override (U+202E),
          # soft hyphen (U+00AD), directional isolates (U+2066-2069).
          FAIL=0
          FILES=$(find standards CLAUDE.md templates/CLAUDE.md -name "*.md" -o -name "CLAUDE.md" 2>/dev/null | sort -u)
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            # grep -P matches literal bytes for the Unicode code points
            if LC_ALL=C grep -Pn '[\x{200B}\x{200C}\x{200D}\x{FEFF}\x{202E}\x{00AD}\x{2066}-\x{2069}]' "$file" 2>/dev/null; then
              echo "FAIL: $file — invisible Unicode character(s) found above"
              FAIL=1
            fi
          done <<< "$FILES"
          [ "$FAIL" -eq 0 ] && echo "OK: No invisible Unicode characters found"
          exit $FAIL

      - name: Hidden HTML comments in Markdown
        id: hidden-html-comments
        continue-on-error: true
        shell: bash
        run: |
          # HTML comments (<!-- -->) render invisibly in Markdown but are visible
          # to LLMs, making them a smuggling vector for hidden instructions.
          # WHY strip fenced code + paired inline-code spans first: a `<!-- -->`
          # wrapped in a genuinely CLOSED backtick span renders visibly as
          # monospace text — a documented example of the forbidden pattern, not
          # an actual hidden comment. A single-char lookbehind check is bypassable
          # with one unmatched backtick (it never renders as code, so the real
          # comment stays invisible); requiring a matched `[^`]*` pair closes that.
          # WHY the fence-count guard: an unbalanced (odd) count of ``` markers
          # means the file has a malformed/unterminated fence -- naively
          # toggling on every ``` would silently treat the rest of the file as
          # "inside code" and never check it again. Falling back to inline-only
          # stripping in that case keeps the rest of the file checked, erring
          # toward catching a real hidden comment rather than silently missing one.
          #
          # WHY the per-line backtick-parity guard: a line with an ODD number of
          # backticks has a stray, unpaired backtick. A naive `s/`[^`]*`//g` still
          # pairs it with the NEXT backtick on the line -- even an unrelated,
          # legitimately-paired one from later in the line -- silently deleting
          # everything between them, including a real hidden comment that stray
          # backtick was placed in front of. Requiring an EVEN count before
          # stripping a line at all closes that: an unpaired backtick means
          # nothing on that line is provably real inline code, so nothing is
          # stripped and the line is checked as-is.
          strip_code() {
            local file="$1"
            local fence_count
            fence_count=$(grep -c '^```' "$file" 2>/dev/null)
            fence_count=${fence_count:-0}
            local fence_stage
            if [ $((fence_count % 2)) -ne 0 ]; then
              fence_stage=$(cat "$file")
            else
              fence_stage=$(awk '/^```/{f=!f;next} f{next} {print}' "$file")
            fi
            printf '%s\n' "$fence_stage" | awk '
              {
                line = $0
                n = gsub(/`/, "`", line)
                if (n % 2 == 0) {
                  gsub(/`[^`]*`/, "", line)
                }
                print line
              }
            '
          }
          FAIL=0
          FILES=$(find standards CLAUDE.md templates/CLAUDE.md -name "*.md" -o -name "CLAUDE.md" 2>/dev/null | sort -u)
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            if strip_code "$file" | grep -Pn '<!--'; then
              echo "FAIL: $file — HTML comment found above (hidden from rendered view, visible to LLMs)"
              FAIL=1
            fi
          done <<< "$FILES"
          [ "$FAIL" -eq 0 ] && echo "OK: No hidden HTML comments found"
          exit $FAIL

      - name: LLM bypass phrases
        id: llm-bypass-phrases
        continue-on-error: true
        shell: bash
        run: |
          # Scan CLAUDE.md and templates/CLAUDE.md for known prompt-injection bypass
          # phrases. Security docs (RULES-FILE-INTEGRITY.md, AGENTIC-SAFETY.md,
          # SECURITY-GUARDRAILS.md) are excluded — they legitimately document these
          # patterns as examples.
          FAIL=0
          BYPASS_PATTERNS=(
            'ignore (all )?(previous|above) instructions'
            'ignore (all )?instructions'
            'disregard (your )?(previous )?instructions'
            'forget (your )?(previous )?instructions'
            'new (system )?instructions?:'
            'you are now a'
            'from now on (you are|act as)'
            'system prompt override'
            'jailbreak'
          )
          for file in CLAUDE.md templates/CLAUDE.md; do
            [ -f "$file" ] || continue
            for pattern in "${BYPASS_PATTERNS[@]}"; do
              if grep -Pin "$pattern" "$file"; then
                echo "FAIL: $file — bypass phrase matched: $pattern"
                FAIL=1
              fi
            done
          done
          [ "$FAIL" -eq 0 ] && echo "OK: No bypass phrases found in CLAUDE.md files"
          exit $FAIL

      # WHY: same rationale as the forbidden-patterns job's gate step above --
      # 3 sequential checks with no continue-on-error means the first failure
      # hides the other two for as long as nobody happens to fix it.
      - name: Gate on all rules-file-integrity checks
        if: always()
        shell: bash
        run: |
          FAIL=0
          [ "${{ steps.invisible-unicode.outcome }}" != "success" ] && { echo "FAILED: Invisible Unicode characters"; FAIL=1; }
          [ "${{ steps.hidden-html-comments.outcome }}" != "success" ] && { echo "FAILED: Hidden HTML comments in Markdown"; FAIL=1; }
          [ "${{ steps.llm-bypass-phrases.outcome }}" != "success" ] && { echo "FAILED: LLM bypass phrases"; FAIL=1; }
          exit $FAIL

  template-integrity:
    name: Template Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Validate hook scripts referenced in templates/.claude/settings.json exist in templates/scripts/
        shell: bash
        run: |
          FAIL=0
          SETTINGS="templates/.claude/settings.json"
          BASEPATHS=$(grep '"command":' "$SETTINGS" \
            | grep -oE '[A-Za-z][A-Za-z0-9_/-]*\.(sh|ps1)' \
            | sed 's/\.[^.]*$//' \
            | sort -u)
          for base in $BASEPATHS; do
            if [ -n "$(compgen -G "templates/${base}.*" 2>/dev/null)" ]; then
              echo "OK:   templates/${base}.* present"
            else
              echo "ERROR: $SETTINGS references $base but the script is missing from templates/:"
              printf  "       Expected: templates/%s.sh\n" "$base"
              printf  "       Expected: templates/%s.ps1\n" "$base"
              FAIL=1
            fi
          done
          bash scripts/check-review-gate-lib-presence.sh templates/scripts || FAIL=1
          [ "$FAIL" -eq 0 ] && echo "template-integrity: PASS" || echo "template-integrity: FAIL"
          exit $FAIL

  mb-command-tests:
    name: MB Command Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Run mb command tests
        shell: bash
        run: bash tests/run.sh

  powershell-lint:
    name: PowerShell Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Lint PowerShell scripts
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Filter "*.ps1" -Path "scripts","templates/scripts" |
            Select-Object -ExpandProperty FullName
          $results = $files | ForEach-Object {
            Invoke-ScriptAnalyzer -Path $_ -Severity Error,Warning -Settings "scripts/PSScriptAnalyzerSettings.psd1"
          }
          if ($results) {
            $results | Format-Table RuleName,Severity,Line,Message -AutoSize
            exit 1
          }
          Write-Host "PSScriptAnalyzer: no errors found in $($files.Count) file(s)"

  mb-doctor-self-check:
    name: MB Doctor Self-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Run mb doctor on this repo
        shell: bash
        run: MB_HOME="$(pwd)" bash scripts/mb.sh doctor

  pester-tests:
    name: Pester Tests (mb.ps1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install Pester
        shell: pwsh
        run: Install-Module -Name Pester -Force -Scope CurrentUser -RequiredVersion 5.7.1

      - name: Run Pester tests
        shell: pwsh
        run: |
          $result = Invoke-Pester -Path "tests/" -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) {
            Write-Host "FAILED: $($result.FailedCount) test(s) failed"
            exit 1
          }
          Write-Host "Pester: $($result.PassedCount) passed, 0 failed"
